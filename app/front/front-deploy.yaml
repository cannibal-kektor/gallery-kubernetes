apiVersion: apps/v1
kind: Deployment
metadata:
  name: gallery-front
  namespace: gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gallery-front
  template:
    metadata:
      labels:
        app: gallery-front
    spec:
      containers:
        - name: gallery-front
          image: lubospodkidos/gallery-front:1.0
          resources:
            requests:
              memory: "32M"
              cpu: "10m"
            limits:
              memory: "64M"
              cpu: "100m"
          ports:
            - containerPort: 9090
          livenessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3