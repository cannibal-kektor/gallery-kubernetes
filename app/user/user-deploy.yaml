apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: gallery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: lubospodkidos/gallery-users-service:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: user-env
          env:
            - name: USERS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USERS_USER
            - name: USERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USERS_PASSWORD
          resources:
            requests:
              memory: "300M"
              cpu: "100m"
            limits:
              memory: "600M"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3