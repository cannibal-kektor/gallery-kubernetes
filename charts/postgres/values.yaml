image:
  repository: postgres
  tag: "18-alpine"

env:
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef:
        name: '{{ $.Release.Name }}-{{ $.Values.secret.secretName }}'
        key: '{{ $.Values.secret.userKey }}'
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: '{{ $.Release.Name }}-{{ $.Values.secret.secretName }}'
        key: '{{ $.Values.secret.passwordKey }}'

variables:
  POSTGRES_DB: '{{ $.Values.dbName }}'

storage:
  name: pgdata
  path: /var/lib/postgresql
  size: 2Gi

containerPort: 5432

service:
  create: true
  headless: true

probe:
  liveness:
    livenessProbe:
      exec:
        command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    initialDelaySeconds: 20
  readiness:
    readinessProbe:
      exec:
        command: ["sh", "-c", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    initialDelaySeconds: 5

resources:
  requests:
    memory: "250Mi"
    cpu: "100m"
  limits:
    memory: "500Mi"
    cpu: "500m"