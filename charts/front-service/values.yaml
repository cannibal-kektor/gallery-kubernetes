serviceName: gallery-front
replicaCount: 1

image:
  repository: lubospodkidos/gallery-front
  tag: "1.0"

containerPort: 9090

service:
  create: true
  servicePort: 80
  targetPort: 9090

probe:
  enabled: true
  liveness:
    livenessProbe:
      httpGet:
        path: /
  readiness:
    readinessProbe:
      httpGet:
        path: /

resources:
  requests:
    memory: "32Mi"
    cpu: "10m"
  limits:
    memory: "64Mi"
    cpu: "100m"