apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: localstack
  namespace: gallery
spec:
  serviceName: "localstack-headless"
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: gresau/localstack-persist
          envFrom:
            - configMapRef:
                name: localstack-env
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
            - name: localstack-data
              mountPath: /persisted-data
          resources:
            requests:
              memory: "250M"
              cpu: "100m"
            limits:
              memory: "500M"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: localstack-init-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: localstack-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi